# Runs on the EC2 host. Images are built and pushed to GHCR by CI.
# The database is Neon, so there is no db service here.
#
#   cp .env.example .env   # fill in DATABASE_URL, JWT_SECRET, ...
#   docker compose -f docker-compose.prod.yml up -d
services:
  migrate:
    image: ghcr.io/${GITHUB_REPOSITORY:?set GITHUB_REPOSITORY}/api-migrate:${IMAGE_TAG:-latest}
    env_file: .env
    restart: "no"

  api:
    image: ghcr.io/${GITHUB_REPOSITORY}/api:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      NODE_ENV: production
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  web:
    image: ghcr.io/${GITHUB_REPOSITORY}/web:${IMAGE_TAG:-latest}
    # Only reachable through the host Nginx, which terminates TLS.
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    depends_on:
      - api
